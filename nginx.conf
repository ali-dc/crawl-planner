upstream fastapi {
    server app:8000;
}

# Cloudflare Tunnel (pubcrawl.devchap.co.uk): cloudflared on the edge network
# sends plain HTTP here and Cloudflare terminates TLS, so no redirect. Matched
# by server_name before the catch-all redirect below.
server {
    listen 80;
    server_name pubcrawl.devchap.co.uk;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    location /api/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(docs|openapi.json|redoc)$ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /app;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt challenge (prefix match, highest priority)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;
    client_max_body_size 10M;

    # SSL certificates (will be managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/bristolpubcrawl.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bristolpubcrawl.xyz/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # All API endpoints - proxy to FastAPI
    location /api/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI docs (keep for backward compatibility)
    location ~ ^/(docs|openapi.json|redoc)$ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files (HTML, CSS, JS)
    location / {
        root /app;
        try_files $uri $uri/ /index.html;
    }

    # Deny access to .files (like .env)
    location ~ /\. {
        deny all;
    }
}
